<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>spike</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1117; color: #e6edf3; font-family: "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }
  .bar { height: 46px; background: #161b22; display: flex; align-items: center; padding: 0 8px; flex: none; }
  .bar .title { flex: 1; font-weight: 600; padding-left: 8px; }
  .bar button { background: transparent; border: 0; color: #8b949e; width: 36px; height: 28px; cursor: pointer; }
  .bar button:hover { background: #21262d; }
  .bar button.close:hover { background: #f85149; color: #fff; }
  main { flex: 1; padding: 16px; }
  .rz { position: fixed; z-index: 10; }
  .rz.n  { top: 0; left: 8px; right: 8px; height: 5px; cursor: ns-resize; }
  .rz.s  { bottom: 0; left: 8px; right: 8px; height: 5px; cursor: ns-resize; }
  .rz.w  { left: 0; top: 8px; bottom: 8px; width: 5px; cursor: ew-resize; }
  .rz.e  { right: 0; top: 8px; bottom: 8px; width: 5px; cursor: ew-resize; }
  .rz.nw { top: 0; left: 0; width: 8px; height: 8px; cursor: nwse-resize; }
  .rz.se { bottom: 0; right: 0; width: 8px; height: 8px; cursor: nwse-resize; }
  .rz.ne { top: 0; right: 0; width: 8px; height: 8px; cursor: nesw-resize; }
  .rz.sw { bottom: 0; left: 0; width: 8px; height: 8px; cursor: nesw-resize; }
  #out { white-space: pre; font-family: Consolas, monospace; font-size: 12px; color: #8b949e; }
</style>
</head>
<body>
  <div class="bar pywebview-drag-region">
    <span class="title">Spike</span>
    <button id="min">_</button>
    <button id="max">[]</button>
    <button id="close" class="close">x</button>
  </div>
  <main>
    <button id="small">720x360</button>
    <button id="big">820x720</button>
    <div id="out"></div>
  </main>
<script>
  const MIN = [700, 600];
  function installResize(api) {
    for (const edge of ['n','s','e','w','nw','ne','sw','se']) {
      const h = document.createElement('div');
      h.className = 'rz ' + edge;
      h.dataset.edge = edge;
      document.body.appendChild(h);
      h.addEventListener('pointerdown', async (ev) => {
        ev.preventDefault();
        h.setPointerCapture(ev.pointerId);
        const r = await api.get_rect();
        const start = { x: ev.screenX, y: ev.screenY, r };
        let pending = null, busy = false;
        const flush = async () => {
          if (busy || !pending) return;
          busy = true;
          const args = pending; pending = null;
          await api.resize_to(...args);
          busy = false;
          flush();
        };
        const move = (e) => {
          const dx = e.screenX - start.x, dy = e.screenY - start.y;
          let w = start.r.w, hgt = start.r.h, fix = '';
          if (edge.includes('e')) w = start.r.w + dx;
          if (edge.includes('w')) { w = start.r.w - dx; fix += 'E'; }
          if (edge.includes('s')) hgt = start.r.h + dy;
          if (edge.includes('n')) { hgt = start.r.h - dy; fix += 'S'; }
          pending = [Math.max(MIN[0], w), Math.max(MIN[1], hgt), fix];
          flush();
        };
        const up = () => {
          h.removeEventListener('pointermove', move);
          h.removeEventListener('pointerup', up);
        };
        h.addEventListener('pointermove', move);
        h.addEventListener('pointerup', up);
      });
    }
  }
  const out = document.getElementById('out');
  function log(t) { out.textContent += t + '\n'; }
  window.addEventListener('pywebviewready', () => {
    const api = window.pywebview.api;
    min.onclick = () => api.minimize();
    max.onclick = () => api.toggle_maximize();
    close.onclick = () => api.close();
    small.onclick = () => api.set_size(720, 360);
    big.onclick = () => api.set_size(820, 720);
    installResize(api);
    log('ready');
  });
  window.addEventListener('resize', () => log('resize ' + innerWidth + 'x' + innerHeight));
</script>
</body>
</html>
